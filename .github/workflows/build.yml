name: Build parity backport
on:
  push:
    branches: ["1.21.1"]
  pull_request:
    branches: ["1.21.1"]
  workflow_dispatch:
concurrency:
  group: truevanilla-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: dfgdrfgh/Ice-Caves-Backport
          ref: 0b7f84114dc49cbd1777484ee49a595b4027227c
          path: vendor/ice-caves
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-excludes: |
            caches/fabric-loom
            caches/architectury-loom
      - name: Fetch verified published Platform 1.4.2 JARs
        run: python .github/scripts/fetch_published_platform.py
      - name: Check nautilus inventory packet ordering
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: python .github/scripts/test_nautilus_open.py
      - name: Check WWOO Pale Garden placement
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: python .github/scripts/test_wwoo_biomes.py
      - name: Verify mixin manifests reference existing source classes
        run: python .github/scripts/check_mixins.py
      - name: Route CI-only Maven dependencies through their matching mirrors
        run: |
          python - <<'PY'
          from pathlib import Path
          gradle = Path("build.gradle")
          original = gradle.read_text()
          source = original
          source = source.replace('        maven { url "https://maven.bawnorton.com/releases" }\\n'.replace('\\n', '\n'), '')
          source = source.replace(
              '        maven { url "https://cursemaven.com" }',
              """        exclusiveContent {
              forRepository { maven { url "https://cursemaven.com" } }
              filter { includeGroup "curse.maven" }
          }""")
          source = source.replace(
              '        maven { url "https://api.modrinth.com/maven" }',
              """        exclusiveContent {
              forRepository { maven { url "https://api.modrinth.com/maven" } }
              filter { includeGroup "maven.modrinth" }
          }""")
          if source == original or "maven.bawnorton.com/releases" in source:
              raise RuntimeError("Unexpected original Gradle mirror layout")
          gradle.write_text(source)
          print("Adjusted CI-only dependency resolution; repository source files remain unchanged")
          PY
      - name: Build merged Ice Caves Fabric module
        if: matrix.loader == 'fabric'
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          curl --fail --location --retry 3 \
            https://maven.fabricmc.net/net/fabricmc/intermediary/1.21.1/intermediary-1.21.1-v2.jar \
            -o /tmp/intermediary-1.21.1-v2.jar
          python vendor/ice-caves/.github/scripts/make_named_intermediary.py \
            /tmp/intermediary-1.21.1-v2.jar \
            vendor/ice-caves/mapping/intermediary-named.jar
          python .github/scripts/prepare_ice_caves_namespace.py
          python .github/scripts/fetch_ice_sounds.py
          bash gradlew -p vendor/ice-caves build --stacktrace --no-daemon
      - name: Compile VanillaBackport
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          bash gradlew :${{ matrix.loader }}:remapJar --stacktrace
      - name: Check dynamic recipes and recipe-book unlocks
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: bash gradlew :common:checkDynamicRecipes --stacktrace
      - name: Check Snow Bricks and Cold archetype resources
        run: python -m unittest discover -s tests -v
      - name: Check dedicated Explorer Maps and Cold archetype codecs
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          python .github/scripts/test_explorer_maps.py common/build/recipe-test-classpath.txt
          python .github/scripts/test_sulfur_cold.py common/build/recipe-test-classpath.txt
          python .github/scripts/test_ice_crevasse.py
          python .github/scripts/test_ice_cave_spawns.py
          python .github/scripts/test_map_markers.py
          python .github/scripts/test_ice_biome.py
          python .github/scripts/test_ice_cave_ores.py
          python .github/scripts/test_ice_freezing.py
      - name: Check cow textures and slab loot parity
        run: python .github/scripts/check_cow_and_slab_parity.py
      - name: Assemble installable mod
        run: python .github/scripts/bundle.py 1.21.1 ${{ matrix.loader }}
      - name: Verify external Platform requirement without embedded API
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: python .github/scripts/check_platform_dependency.py ${{ matrix.loader }}
      - name: Validate bundled Ice Caves and creative section
        run: python .github/scripts/check_ice_caves_integration.py ${{ matrix.loader }}
      - name: Verify WWOO biome parity in packaged release JAR
        run: python .github/scripts/check_packaged_worldgen.py
      - name: Check integrated Tiny Takeover content
        run: python .github/scripts/check_tiny_integration.py ${{ matrix.loader }}
      - name: Verify binary linkage against published external Platform 1.4.2
        run: python .github/scripts/check_published_platform_abi.py ${{ matrix.loader }}
      - name: Check production server startup
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: python .github/scripts/smoke.py ${{ matrix.loader }}
      - name: Build isolated runtime parity tests
        if: matrix.loader == 'fabric'
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: bash gradlew :fabric:remapParityTestJar --stacktrace
      - name: Test transformed maps and ice mechanics in production
        if: matrix.loader == 'fabric'
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: python .github/scripts/smoke.py fabric parity
      - name: Check WWOO compatibility in a normal world
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: python .github/scripts/smoke.py ${{ matrix.loader }} wwoo
      - uses: actions/upload-artifact@v5
        with:
          name: VanillaBackport-1.21.1-${{ matrix.loader }}
          path: dist/*
          if-no-files-found: error
