pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://files.minecraftforge.net/maven/" }
        gradlePluginPortal()
    }
}

rootProject.name = 'vanillabackport'

include 'common'
include 'fabric'
// CI can skip NeoForge project configuration when building the Fabric artifact.
// Normal local builds still include both loaders.
if (System.getenv("TRUEVANILLA_FABRIC_CI") != "true") {
    include 'neoforge'
}
